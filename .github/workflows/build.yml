name: Build Panda AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Dummy Google Services JSON with Web Client ID
      run: |
        mkdir -p app
        echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456","android_client_info":{"package_name":"com.blurr.voice"}},"oauth_client":[{"client_id":"dummy_web_client_id.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"dummy_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[{"client_id":"dummy_web_client_id.apps.googleusercontent.com","client_type":3}]}}}]}' > app/google-services.json

    - name: Inject default_web_client_id into strings.xml
      run: |
        mkdir -p app/src/main/res/values
        STRINGS_FILE="app/src/main/res/values/strings.xml"
        if [ ! -f "$STRINGS_FILE" ]; then
          echo '<resources><string name="default_web_client_id">dummy_web_client_id.apps.googleusercontent.com</string></resources>' > "$STRINGS_FILE"
        else
          sed -i '/<\/resources>/i \    <string name="default_web_client_id">dummy_web_client_id.apps.googleusercontent.com<\/string>' "$STRINGS_FILE"
        fi

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Panda-AI-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
